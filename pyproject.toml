[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vem"
version = "0.1.0"
description = "A centralized Python virtual environment manager"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
vem = "vem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

